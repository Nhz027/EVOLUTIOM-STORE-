<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Evolutium Craft</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#0a0a0c;
background-image:
radial-gradient(circle at top,#3d1a00 0%,#0a0a0c 60%);
color:#fff;
padding:20px;
overflow-x:hidden;
position:relative;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,0.08), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,140,0,0.06), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,140,0,0.05), transparent 25%);
pointer-events:none;
animation:bgMove 12s linear infinite;
}

@keyframes bgMove{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#FF8C00;
border-radius:10px;
}

h1{
text-align:center;
margin-bottom:35px;
font-size:38px;
font-weight:800;
letter-spacing:3px;
text-transform:uppercase;
text-shadow:0 0 15px rgba(255,140,0,0.45);
animation:aparecer 0.6s ease;
}

h1 span{
color:#FF8C00;
}

.menu-abas{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:40px;
flex-wrap:wrap;
}

.aba{
padding:12px 25px;
background:#16161a;
border:1px solid #333;
border-radius:10px;
cursor:pointer;
font-weight:bold;
color:#ccc;
transition:0.25s;
}

.aba:hover{
transform:translateY(-3px);
border-color:#FF8C00;
color:#FF8C00;
box-shadow:0 0 18px rgba(255,140,0,0.25);
}

.aba.ativa{
border-color:#FF8C00;
color:#FF8C00;
box-shadow:0 0 18px rgba(255,140,0,0.2);
}

.loja-container{
display:none;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:22px;
max-width:1200px;
margin:0 auto;
animation:aparecer 0.4s ease;
}

.card{
background:rgba(17,17,20,0.95);
border-radius:16px;
padding:15px;
border:1px solid #222;
transition:0.3s ease;
overflow:hidden;
position:relative;
backdrop-filter:blur(8px);
animation:aparecer 0.5s ease;
}

.card:hover{
transform:translateY(-6px) scale(1.01);
border-color:#FF8C00;
box-shadow:0 0 28px rgba(255,140,0,0.25);
}

.banner-img{
width:100%;
border-radius:10px;
transition:0.35s;
}

.card:hover .banner-img{
transform:scale(1.03);
}

.preco-antigo{
text-decoration:line-through;
color:#888;
font-size:14px;
}

.preco{
font-size:24px;
font-weight:bold;
margin:8px 0 12px;
color:#FF8C00;
text-shadow:0 0 10px rgba(255,140,0,0.4);
}

.btn{
background:#FF8C00;
border:none;
padding:13px;
width:100%;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:700;
transition:0.25s;
position:relative;
overflow:hidden;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 0 18px rgba(255,140,0,0.45);
}

.btn:active{
transform:scale(0.98);
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-120%;
width:100%;
height:100%;
background:rgba(255,255,255,0.18);
transform:skewX(-20deg);
}

.btn:hover::before{
left:120%;
transition:0.6s;
}

.vip-page{
display:none;
max-width:850px;
margin:auto;
text-align:center;
animation:aparecer 0.4s ease;
}

.vip-kits{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin-top:18px;
}

.vip-kits img{
width:120px;
border-radius:12px;
transition:0.25s;
}

.vip-kits img:hover{
transform:scale(1.08);
box-shadow:0 0 18px rgba(255,140,0,0.3);
}

.pix-global{
display:none;
max-width:500px;
margin:30px auto;
text-align:center;
animation:aparecer 0.4s ease;
}

.pix-box{
background:#000;
padding:15px;
border:2px dashed #FF8C00;
margin:20px 0;
font-family:monospace;
color:#FFDD00;
border-radius:10px;
word-break:break-all;
}

.voltar-btn{
margin-top:15px;
background:#1d1d22;
}

.voltar-btn:hover{
background:#2a2a31;
}

@keyframes aparecer{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:700px){

body{
padding:15px;
}

h1{
font-size:30px;
}

.aba{
width:100%;
text-align:center;
}

.card{
padding:12px;
}

.preco{
font-size:21px;
}

}

</style>
</head>

<body>

<h1>EVOLUTIUM <span>CRAFT</span></h1>

<div class="menu-abas">
<div class="aba ativa" onclick="mostrar('kits')">🐉 KITS</div>
<div class="aba" onclick="mostrar('vips')">💎 VIPS</div>
</div>

<!-- KITS -->
<div id="kits" class="loja-container" style="display:grid;">

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777948112627-679cbc63-dc9b-449f-9edf-abc0ab5da980.png" class="banner-img">
<div>KIT DBE</div>
<div class="preco">R$ 79,99</div>
<button class="btn" onclick="comprar('KIT DBE')">🛒 Comprar</button>
</div>

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777932013675-f02a1c3f-2dd6-4e65-ae44-e294a0d3531f.png" class="banner-img">
<div>KIT GOD</div>
<div class="preco">R$ 59,99</div>
<button class="btn" onclick="comprar('KIT GOD')">🛒 Comprar</button>
</div>

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777201425071-e8de1cf8-926f-47c3-a4a0-00c6bba187b5.png" class="banner-img">
<div>KIT DIVINO</div>
<div class="preco">R$ 19,99</div>
<button class="btn" onclick="comprar('KIT DIVINO')">🛒 Comprar</button>
</div>

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777948165223-cb6b7142-86d5-4ac3-8241-d79ac6beb846.png" class="banner-img">
<div>KIT UPADOR</div>
<div class="preco">R$ 16,99</div>
<button class="btn" onclick="comprar('KIT UPADOR')">🛒 Comprar</button>
</div>

</div>

<!-- PIX -->
<div id="pixGlobal" class="pix-global">

<h2 id="produtoNome"></h2>

<div class="pix-box" id="pixTexto">
efc0f5af-cd44-400c-9426-2d071caa7bec
</div>

<button class="btn" onclick="copiar()">📋 Copiar Pix</button>

<button class="btn" onclick="abrirDiscord()" style="margin-top:10px;">
💬 Discord
</button>

<button class="btn voltar-btn" onclick="mostrar('kits')">
⬅ Voltar
</button>

<p style="margin-top:15px; text-align:left; line-height:1.7;">
1. Copie a chave Pix<br>
2. Faça o pagamento<br>
3. Clique em abrir Discord<br>
4. Abra um ticket<br>
5. Envie o comprovante<br>
6. Aguarde o ADM
</p>

</div>

<script>

function removerAtiva(){
document.querySelectorAll(".aba").forEach(btn=>{
btn.classList.remove("ativa");
});
}

function mostrar(sec){

document.getElementById("kits").style.display="none";
document.getElementById("vips").style.display="none";
document.getElementById("pixGlobal").style.display="none";

document.getElementById(sec).style.display="grid";

removerAtiva();

if(sec === "kits"){
document.querySelectorAll(".aba")[0].classList.add("ativa");
}

if(sec === "vips"){
document.querySelectorAll(".aba")[1].classList.add("ativa");
}

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function comprar(nome){

document.getElementById("kits").style.display="none";
document.getElementById("vips").style.display="none";

document.getElementById("pixGlobal").style.display="block";

document.getElementById("produtoNome").innerText = nome;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function copiar(){

const texto = "efc0f5af-cd44-400c-9426-2d071caa7bec";

navigator.clipboard.writeText(texto)
.then(()=>{
alert("Pix copiado!");
})
.catch(()=>{
alert("Erro ao copiar!");
});

}

function abrirDiscord(){
window.open("https://discord.gg/fPxe5RRec", "_blank");
}

</script>

</body>
</html>
