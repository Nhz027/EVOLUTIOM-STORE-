<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Evolutium Craft</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#0a0a0c;
background-image:radial-gradient(circle at top,#3d1a00 0%,#0a0a0c 60%);
color:#fff;
padding:20px;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,140,0,0.08), transparent 25%),
radial-gradient(circle at 80% 40%, rgba(255,140,0,0.05), transparent 25%);
pointer-events:none;
animation:bgMove 12s linear infinite;
}

@keyframes bgMove{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#FF8C00;
border-radius:10px;
}

h1{
text-align:center;
margin-bottom:35px;
font-size:38px;
font-weight:800;
letter-spacing:3px;
text-transform:uppercase;
text-shadow:0 0 15px rgba(255,140,0,0.45);
}

h1 span{
color:#FF8C00;
}

.menu-abas{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:40px;
flex-wrap:wrap;
}

.aba{
padding:12px 25px;
background:#16161a;
border:1px solid #333;
border-radius:10px;
cursor:pointer;
font-weight:bold;
color:#ccc;
transition:0.25s;
}

.aba:hover{
transform:translateY(-3px);
border-color:#FF8C00;
color:#FF8C00;
box-shadow:0 0 18px rgba(255,140,0,0.25);
}

.aba.ativa{
border-color:#FF8C00;
color:#FF8C00;
box-shadow:0 0 18px rgba(255,140,0,0.2);
}

.loja-container{
display:none;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:22px;
max-width:1200px;
margin:0 auto;
animation:aparecer .4s ease;
}

.card{
background:#111114;
border-radius:16px;
padding:15px;
border:1px solid #222;
transition:.3s;
overflow:hidden;
}

.card:hover{
transform:translateY(-6px);
border-color:#FF8C00;
box-shadow:0 0 25px rgba(255,140,0,.25);
}

.banner-img{
width:100%;
border-radius:10px;
transition:.3s;
}

.card:hover .banner-img{
transform:scale(1.03);
}

.preco{
font-size:24px;
font-weight:bold;
margin:8px 0 12px;
color:#FF8C00;
}

.btn{
background:#FF8C00;
border:none;
padding:13px;
width:100%;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:700;
transition:.25s;
margin-top:8px;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 0 18px rgba(255,140,0,.45);
}

.vip-page{
display:none;
max-width:900px;
margin:auto;
text-align:center;
animation:aparecer .4s ease;
}

.vip-kits{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin-top:18px;
}

.vip-kits img{
width:120px;
border-radius:12px;
transition:.25s;
}

.vip-kits img:hover{
transform:scale(1.08);
}

.pix-global{
display:none;
max-width:500px;
margin:30px auto;
text-align:center;
}

.pix-box{
background:#000;
padding:15px;
border:2px dashed #FF8C00;
margin:20px 0;
font-family:monospace;
color:#FFDD00;
border-radius:10px;
word-break:break-all;
}

.voltar-btn{
background:#1d1d22;
}

#carrinhoBox{
position:fixed;
bottom:20px;
right:20px;
background:#111114;
border:1px solid #FF8C00;
padding:15px;
border-radius:14px;
width:300px;
z-index:999;
box-shadow:0 0 25px rgba(255,140,0,.25);
display:none;
max-height:400px;
overflow:auto;
}

@keyframes aparecer{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:700px){

body{
padding:15px;
}

h1{
font-size:30px;
}

.aba{
width:100%;
text-align:center;
}

#carrinhoBox{
width:90%;
right:5%;
bottom:10px;
}

}

</style>
</head>

<body>

<h1>EVOLUTIUM <span>CRAFT</span></h1>

<div class="menu-abas">
<div class="aba ativa" onclick="mostrar('kits')">🐉 KITS</div>
<div class="aba" onclick="mostrar('vips')">💎 VIPS</div>
</div>

<!-- KITS -->
<div id="kits" class="loja-container" style="display:grid;">

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777948112627-679cbc63-dc9b-449f-9edf-abc0ab5da980.png" class="banner-img">
<div>KIT DBE</div>
<div class="preco">R$ 79,99</div>
<button class="btn" onclick="adicionarCarrinho('KIT DBE',79.99)">🛒 Adicionar</button>
</div>

<div class="card">
<img src="https://www.image2url.com/r2/default/images/1777932013675-f02a1c3f-2dd6-4e65-ae44-e294a0d3531f.png" class="banner-img">
<div>KIT GOD</div>
<div class="preco">R$ 59,99</div>
<button class="btn" onclick="adicionarCarrinho('KIT GOD',59.99)">🛒 Adicionar</button>
</div>

</div>

<!-- CARRINHO -->
<div id="carrinhoBox">

<h3 style="margin-bottom:10px;color:#FF8C00;">
🛒 Carrinho
</h3>

<div id="itensCarrinho" style="
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:15px;
"></div>

<div style="
display:flex;
justify-content:space-between;
margin-bottom:15px;
font-weight:bold;
">
<span>Total:</span>
<span id="totalCarrinho">R$ 0,00</span>
</div>

<button class="btn" onclick="finalizarCompra()">
💳 Finalizar Compra
</button>

</div>

<script>

let carrinho = [];

function esconderTudo(){

document.getElementById("kits").style.display="none";
document.getElementById("vips").style.display="none";

}

function mostrar(sec){

esconderTudo();

document.getElementById(sec).style.display="grid";

document.querySelectorAll(".aba").forEach(el=>{
el.classList.remove("ativa");
});

if(sec === "kits"){
document.querySelectorAll(".aba")[0].classList.add("ativa");
}

if(sec === "vips"){
document.querySelectorAll(".aba")[1].classList.add("ativa");
}

}

function mostrarToast(msg){

let toast = document.getElementById("toast");

if(!toast){

toast = document.createElement("div");
toast.id = "toast";

toast.style.position = "fixed";
toast.style.bottom = "20px";
toast.style.left = "50%";
toast.style.transform = "translateX(-50%)";
toast.style.background = "linear-gradient(135deg,#ff8c00,#ffb347)";
toast.style.color = "#fff";
toast.style.padding = "14px 24px";
toast.style.borderRadius = "14px";
toast.style.fontWeight = "700";
toast.style.fontSize = "15px";
toast.style.boxShadow = "0 0 25px rgba(255,140,0,.45)";
toast.style.zIndex = "999999";
toast.style.opacity = "0";
toast.style.transition = ".35s";
toast.style.pointerEvents = "none";

document.body.appendChild(toast);

}

toast.innerText = msg;

toast.style.opacity = "1";
toast.style.bottom = "40px";

setTimeout(()=>{
toast.style.opacity = "0";
toast.style.bottom = "20px";
},2500);

}

function adicionarCarrinho(nome,preco){

carrinho.push({
nome,
preco
});

atualizarCarrinho();

mostrarToast(nome + " adicionado ao carrinho!");

}

function atualizarCarrinho(){

const box = document.getElementById("carrinhoBox");
const itens = document.getElementById("itensCarrinho");
const total = document.getElementById("totalCarrinho");

itens.innerHTML = "";

let soma = 0;

carrinho.forEach((item,index)=>{

soma += item.preco;

itens.innerHTML += `
<div style="
background:#1a1a1f;
padding:10px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
">

<div>
<div style="font-size:14px;">
${item.nome}
</div>

<div style="
color:#FF8C00;
font-weight:bold;
">
R$ ${item.preco.toFixed(2)}
</div>

</div>

<button onclick="removerItem(${index})" style="
background:red;
border:none;
color:white;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
">
X
</button>

</div>
`;

});

total.innerText = `R$ ${soma.toFixed(2)}`;

box.style.display = carrinho.length > 0 ? "block" : "none";

}

function removerItem(index){

carrinho.splice(index,1);

atualizarCarrinho();

mostrarToast("Item removido!");

}

function finalizarCompra(){

if(carrinho.length <= 0){

mostrarToast("Seu carrinho está vazio!");

return;

}

mostrarToast("Compra iniciada!");

}

</script>

</body>
  </html>
